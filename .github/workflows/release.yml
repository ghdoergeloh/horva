name: Release Electron App

on:
  push:
    tags:
      - "v*"
  # Called by release-please.yml once it has cut a release. A tag created with
  # the GITHUB_TOKEN does not trigger the `push` event above, so the release
  # workflow has to be invoked directly.
  workflow_call:
    inputs:
      tag:
        description: "Release tag the installers are attached to (e.g. v0.1.0)."
        required: true
        type: string
      ref:
        description: "Ref or SHA to build. Defaults to the tag; release-please passes a SHA because its draft release has no tag ref yet."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave empty to build current ref without publishing."
        required: false
        type: string
        default: ""
      ref:
        description: "Ref or SHA to build. Defaults to the tag, or to the current ref."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier Check
        run: pnpm format

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm typecheck

      - name: ESLint Check
        run: pnpm lint

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_glob: |
              apps/electron/dist-electron/*.dmg
              apps/electron/dist-electron/*.dmg.blockmap
              apps/electron/dist-electron/*-mac.zip
              apps/electron/dist-electron/latest-mac.yml
          - os: windows-latest
            platform: win
            artifact_glob: |
              apps/electron/dist-electron/*.exe
              apps/electron/dist-electron/*.exe.blockmap
              apps/electron/dist-electron/latest.yml
          - os: ubuntu-latest
            platform: linux
            artifact_glob: |
              apps/electron/dist-electron/*.AppImage
              apps/electron/dist-electron/latest-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Package Electron app
        # `run pack`, not `pack`: pnpm has a builtin `pack` command (npm-style
        # tarball), and `pnpm -F <pkg> pack` resolves to that builtin instead of
        # the package script — it never reaches electron-builder.
        #
        # --publish never: electron-builder would otherwise upload to the
        # release on its own (publish defaults to onTagOrDraft), racing the
        # upload step below.
        run: pnpm --filter @horva/electron-app run pack -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: horva-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Attach installers and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # release-please has already created a draft release holding the
          # changelog. A hand-pushed tag has not, so create one to attach to.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

          find artifacts -type f -print0 \
            | xargs -0 --no-run-if-empty gh release upload "$TAG" --clobber

          # Undrafting is what creates the tag for a release-please draft, so
          # the tag appears exactly when the installers are downloadable.
          gh release edit "$TAG" --draft=false
