name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write

# Skip duplicate jobs on PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./tooling/github/setup

      - name: Prettier Check
        run: pnpm format

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm typecheck

      - name: ESLint Check
        run: pnpm lint

      - name: Run Vitest Tests
        run: pnpm test:unit:coverage

      - name: Install Electron E2E system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Electron E2E Tests
        # New (first cut): the Electron app has never been exercised by
        # Playwright's _electron on a GitHub-hosted runner before this.
        # continue-on-error until that's confirmed a few times — flip to a
        # real gate once it's proven stable there.
        continue-on-error: true
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      - name: CRAP Score Report
        # Report-only: complexity × missing coverage, derived from the
        # coverage-final.json files the previous step just wrote. Does not
        # gate the build (see tooling/quality/crap-score.mjs).
        continue-on-error: true
        run: pnpm crap

      - name: Collect non-empty cobertura reports
        id: cov
        run: |
          files=$(grep -l '<package ' apps/*/coverage/cobertura-coverage.xml packages/*/coverage/cobertura-coverage.xml 2>/dev/null | paste -sd, -)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Code Coverage Summary Report
        if: steps.cov.outputs.files != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ${{ steps.cov.outputs.files }}
          badge: true
          format: markdown
          output: both

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request' && steps.cov.outputs.files != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: code-coverage-results.md
