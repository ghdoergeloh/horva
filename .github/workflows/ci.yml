name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write

# Skip duplicate jobs on PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: horva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # packages/core's slot.service.spec.ts / task.service.spec.ts run
      # against a real Postgres (see packages/core/src/test-support/db.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/horva
    steps:
      - uses: actions/checkout@v7

      - uses: ./tooling/github/setup

      - name: Push DB schema
        # `push` (schema diff), not `migrate` (migration files): the checked
        # in migrations under packages/db/drizzle/ are currently behind
        # schema.ts (discovered while wiring this up — e.g. task.priority
        # has no migration). Fixing that drift is a separate task; `push`
        # sidesteps it by diffing schema.ts directly against the DB.
        run: pnpm --filter @horva/db exec drizzle-kit push --force

      - name: Format Check
        run: pnpm format

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency Cruiser (circular imports)
        run: pnpm depcruise

      - name: Knip (unused files/deps/exports)
        run: pnpm knip

      - name: Run Vitest Tests
        run: pnpm test:unit:coverage

      - name: Install Electron E2E system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Electron E2E Tests
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      - name: CRAP Score Report
        # Report-only: complexity × missing coverage, derived from the
        # coverage-final.json files the previous step just wrote. Does not
        # gate the build (see tooling/quality/crap-score.mjs).
        continue-on-error: true
        run: pnpm crap

      - name: Collect non-empty cobertura reports
        id: cov
        run: |
          files=$(grep -l '<package ' apps/*/coverage/cobertura-coverage.xml packages/*/coverage/cobertura-coverage.xml 2>/dev/null | paste -sd, -)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Code Coverage Summary Report
        if: steps.cov.outputs.files != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ${{ steps.cov.outputs.files }}
          badge: true
          format: markdown
          output: both

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request' && steps.cov.outputs.files != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: code-coverage-results.md
