name: Release Please

# Every merge into main updates (or opens) a release PR that carries the next
# version and the CHANGELOG entries derived from the Conventional Commits since
# the last release. Merging *that* PR is what cuts a release — a merge into main
# on its own never does.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installers:
    # The release-please release is created as a draft, so GitHub has not
    # created the tag ref yet — hence `ref: sha` for the checkout while `tag`
    # addresses the draft release the installers get attached to.
    #
    # This is also why release.yml is *called* instead of being left to its own
    # tag trigger: releases and tags created with the GITHUB_TOKEN deliberately
    # do not start further workflow runs.
    name: Build and publish installers
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      ref: ${{ needs.release-please.outputs.sha }}
