name: PR Title

# Pull requests are merged with a merge commit whose title is the PR title.
# release-please reads that title (next to the branch commits) to compute
# the next version and the changelog. commitlint only checks the branch
# commits, so the title is checked here.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same list as commitlint.config.js
          # (@commitlint/config-conventional). release.spec.ts in
          # tooling/quality checks that they match.
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
