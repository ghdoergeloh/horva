<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>Horva</title>
    <style>
      /* Colors of the design system (tooling/tailwind/theme.css); this page
         shows before any CSS of the app has loaded. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f6f7f5;
        --ink: #1d6a45;
        --running: #e06d0c;
        --muted: #58635b;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #111612;
          --ink: #5fc48f;
          --running: #ff9440;
          --muted: #9aa69d;
        }
      }
      html.dark,
      html.dark body {
        background: #111612;
        --ink: #5fc48f;
        --running: #ff9440;
        --muted: #9aa69d;
      }

      #app-boot-spinner {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 9999;
      }

      #app-boot-spinner p {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }

      /* The hands turn around the pivot; the minute hand 12 times as fast
         as the hour hand. With reduced motion they stand as a check mark. */
      @keyframes boot-turn {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-hand {
        transform-box: view-box;
        transform-origin: 32px 34px;
        animation: boot-turn linear infinite;
      }
      .boot-minute {
        animation-duration: 1.2s;
      }
      .boot-hour {
        animation-duration: 14.4s;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-hand {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Boot loader: shown at once, removed by React on its first render -->
    <div id="app-boot-spinner">
      <svg
        width="64"
        height="64"
        viewBox="8 8 48 48"
        fill="none"
        role="img"
        aria-label="Laden"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="32" cy="32" r="19" stroke="var(--ink)" stroke-width="6" />
        <path
          d="M22.5 15.55A19 19 0 0 1 48.45 22.5"
          stroke="var(--running)"
          stroke-width="6"
          stroke-linecap="round"
        />
        <path
          class="boot-hand boot-hour"
          d="M32 34L26 27"
          stroke="var(--ink)"
          stroke-width="5"
          stroke-linecap="round"
        />
        <path
          class="boot-hand boot-minute"
          d="M32 34L40.5 21.5"
          stroke="var(--ink)"
          stroke-width="5"
          stroke-linecap="round"
        />
        <circle cx="32" cy="34" r="3.2" fill="var(--running)" />
      </svg>
      <p>Laden…</p>
    </div>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
