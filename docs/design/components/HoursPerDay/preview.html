<!doctype html>

      .hp-grid {
        stroke: var(--border);
        stroke-width: 1;
      }
      .hp-ax {
        font: 500 12px var(--font-mono);
        fill: var(--muted-foreground);
      }
      .hp-val {
        font: 500 12px var(--font-mono);
        fill: var(--foreground);
      }
      .hp-target {
        stroke: var(--foreground);
        stroke-width: 1.5;
        stroke-dasharray: 4 4;
        opacity: 0.6;
      }
      .hp-tl {
        font: 500 11px var(--font-sans);
        fill: var(--muted-foreground);
      }
      .hp-seg {
        cursor: pointer;
        transition: opacity var(--duration-fast) var(--ease-out);
      }
      .hp-seg:focus-visible {
        outline: 2px solid var(--ring);
      }
      .is-dim {
        opacity: 0.35;
      }
      .hp-leg {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-4);
        font-size: 13px;
        color: var(--foreground);
        margin-bottom: var(--space-3);
      }

    <script>
      (function () {
        var tip = document.createElement("div");
        tip.className = "hv-tip";
        tip.hidden = true;
        document.body.appendChild(tip);
        function show(el) {
          var d = el.dataset.tip.split("|");
          tip.innerHTML = '<b></b><div></div><div class="hv-num"></div>';
          tip.children[0].textContent = d[0];
          tip.children[1].textContent = d[1];
          tip.children[2].textContent = d[2];
          tip.hidden = false;
          var r = el.getBoundingClientRect();
          tip.style.left =
            Math.min(
              Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2),
              innerWidth - tip.offsetWidth - 8,
            ) + "px";
          tip.style.top = r.top + scrollY - tip.offsetHeight - 8 + "px";
        }
        document.querySelectorAll("[data-tip]").forEach(function (el) {
          el.addEventListener("mouseenter", function () {
            show(el);
          });
          el.addEventListener("focus", function () {
            show(el);
          });
          el.addEventListener("mouseleave", function () {
            tip.hidden = true;
          });
          el.addEventListener("blur", function () {
            tip.hidden = true;
          });
        });
      })();
    </script>
    <script>
      (function () {
        function hl(k) {
          document.querySelectorAll("[data-k]").forEach(function (e) {
            e.classList.toggle("is-dim", k && e.dataset.k !== k);
            e.classList.toggle("is-hover", k && e.dataset.k === k);
          });
        }
        document.querySelectorAll("[data-k]").forEach(function (e) {
          e.addEventListener("mouseenter", function () {
            hl(e.dataset.k);
          });
          e.addEventListener("focus", function () {
            hl(e.dataset.k);
          });
          e.addEventListener("mouseleave", function () {
            hl(null);
          });
          e.addEventListener("blur", function () {
            hl(null);
          });
        });
      })();
    </script>

</html>
