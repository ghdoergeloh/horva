<!-- @dsCard group="Marke" height=230 subtitle="Bildmarke E mit drehenden Zeigern, Minute : Stunde = 12 : 1" -->
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Loader</title>
    <style>
      .ld-row {
        display: flex;
        gap: var(--space-6);
        align-items: center;
        flex-wrap: wrap;
      }
      .ld-cap {
        font-size: 12px;
        line-height: 16px;
        color: var(--muted-foreground);
      }
      .ld-still .ld-min,
      .ld-still .ld-hour {
        animation: none;
      }
    </style>
  </head>

          viewBox="8 8 48 48"
          width="64"
          height="64"
          role="img"
          aria-label="Lädt"
        >
          <circle
            cx="32"
            cy="32"
            r="19"
            fill="none"
            class="ld-r"
            stroke-width="6"
          />
          <path
            d="M22.5 15.55A19 19 0 0 1 48.45 22.5"

            class="ld-a"

            stroke-linecap="round"

            d="M32 34L26 27"

            stroke-width="5"
            stroke-linecap="round"

            d="M22.5 15.55A19 19 0 0 1 48.45 22.5"
            fill="none"
            class="ld-a"
            stroke-width="6"
            stroke-linecap="round"
          />

            class="ld-hour ld-h"
            d="M32 34L26 27"
            fill="none"
            stroke-width="5"
            stroke-linecap="round"
          />
          <path
            class="ld-min ld-h"
            d="M32 34L40.5 21.5"
            fill="none"
            stroke-width="5"
            stroke-linecap="round"
          />

        ><svg
          class="hv-loader"
          viewBox="8 8 48 48"
          width="20"
