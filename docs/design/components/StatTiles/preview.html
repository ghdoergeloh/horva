<!-- @dsCard group="Auswertung" height=150 subtitle="Kennzahlen über dem Zeitraum" -->
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>StatTiles</title>
  </head>
  <body>
    <div class="hv-kpis">
      <div class="hv-kpi">
        <div class="hv-kpi__label">Gesamt</div>
        <div class="hv-kpi__value">23:32<small>h</small></div>
        <div class="hv-kpi__delta">Soll 32:00 · −8:28</div>
      </div>
      <div class="hv-kpi">
        <div class="hv-kpi__label">Ø pro Arbeitstag</div>
        <div class="hv-kpi__value">7:51<small>h</small></div>
        <div class="hv-kpi__delta">3 Tage erfasst</div>
      </div>
      <div class="hv-kpi">
        <div class="hv-kpi__label">Größtes Projekt</div>
        <div
          class="hv-kpi__value"
          style="
            font-family: var(--font-sans);
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
          "
        >
          <span
            class="hv-dot"
            style="--c: var(--project-7); width: 12px; height: 12px"
          ></span
          >Kranich
        </div>
        <div class="hv-kpi__delta">31 % · 7:17 h</div>
      </div>
      <div class="hv-kpi">
        <div class="hv-kpi__label">Ohne Aufgabe</div>
        <div class="hv-kpi__value">0:01<small>h</small></div>
        <div class="hv-kpi__delta">Lücken: 1:03 h</div>
      </div>
    </div>
  </body>
</html>
