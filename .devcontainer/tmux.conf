# tmux config for the dev container.
#
# tmux is how work survives a VS Code disconnect: integrated terminals are children
# of the container-side VS Code server and get killed with it, while a tmux session
# is owned by no client and keeps running inside the container.

# Long scrollback: an agent session produces a lot of output, and after reattaching
# the buffer is the only record of what happened while you were away.
set -g history-limit 100000

# Mouse support, so scrolling and pane selection work in the VS Code terminal.
set -g mouse on

# 24-bit colour, so the Claude Code TUI renders correctly. tmux needs to be told
# which outer terminals support it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc"

# Keep a session alive after its last window exits, so a crashed command does not
# silently take the session down with it.
set -g remain-on-exit off
set -g destroy-unattached off

# Start numbering at 1 — easier to reach on the keyboard than 0.
set -g base-index 1
setw -g pane-base-index 1

# Show the session name in the status bar, so it is obvious which session you
# reattached to.
set -g status-left "#[bold] #S #[default]"
set -g status-right " %H:%M "
