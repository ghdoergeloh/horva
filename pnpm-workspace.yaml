catalogs:
  react19:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1

linkWorkspacePackages: true

# Tailwind pins an exact lightningcss version that differs from the one Vite
# uses. One shared version avoids two copies of the native binary.
overrides:
  # One @types/node for the whole graph, on the Node.js major from .nvmrc.
  # Transitive peers would otherwise pull in the latest major as well.
  "@types/node": "catalog:"
  lightningcss: ^1.33.0

# dependency-cruiser needs the TypeScript compiler API, which TypeScript 7.0
# does not have (it supports 7.1 again). It gets TypeScript 6 of its own so it
# still sees type-only imports. Remove this once TypeScript 7.1 is out.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: ^6.0.3

# Dependencies may not install agent skills into the repository.
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
