catalogs:
  react19:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0

linkWorkspacePackages: true

# Tailwind pins an exact lightningcss version that differs from the one Vite
# uses. One shared version avoids two copies of the native binary.
overrides:
  # One @types/node for the whole graph, on the Node.js major from .nvmrc.
  # Transitive peers would otherwise pull in the latest major as well.
  "@types/node": "catalog:"
  lightningcss: ^1.33.0

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-packagejson
  - prettier-plugin-tailwindcss
