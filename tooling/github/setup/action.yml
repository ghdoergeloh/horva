name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"

    # No global turbo install: pnpm 11 derives the global bin dir by appending
    # /bin to PNPM_HOME, which pnpm/action-setup points at ".../node_modules/.bin".
    # The resulting ".../node_modules/.bin/bin" is not in PATH, so `pnpm add -g`
    # fails. It was redundant anyway — turbo is a root devDependency and every CI
    # step invokes it through a `pnpm <script>`, which resolves it locally.
    - shell: bash
      run: pnpm install
